name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: esperai-projeto
      - name: Preparar chave de assinatura
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/esperai.jks"
      - name: Compilar
        working-directory: esperai-projeto
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/esperai.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DATA_URL: https://esperaai.netlify.app/json/dados.json
        run: gradle assembleAdminRelease assembleUsuarioRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: esperai-projeto/app/build/outputs/apk/*/release/*.apk
